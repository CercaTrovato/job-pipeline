# Synthetic test scenario only. These values are not user preferences or defaults.
CN:
  locations: [深圳, Shenzhen]
  remote_locations: [成都, Chengdu] # Exercises the remote-location branch in unit tests.
  max_days_per_week: 4
  days_negotiable: true
  max_min_months: 6
  employment_types: [internship, parttime, unknown]
  visa_ok: [none, unknown]
  regex_kill:
    - {pattern: "(全职|Full[- ]?time)(?![^。；;\\n]{0,15}(实习|intern))", reason: "要求全职"}
    - {pattern: "已毕业|毕业生优先|graduated", reason: "要求已毕业"}
    - {pattern: "((7|8|9|10|11|12|七|八|九|十|十一|十二)\\s*个月|(1|一)\\s*年)(以上|起|及以上)", reason: "要求 ≥7 个月"}
  regex_flag:
    - {pattern: "(每周|一周)\\s*5\\s*天|5\\s*days?\\s*(a|per)\\s*week", note: "要求每周 5 天（可谈）"}
  campus:
    locations: [深圳, Shenzhen, 成都, Chengdu]
    max_days_per_week: 7
    max_min_months: 99
    employment_types: [fulltime, internship, parttime, unknown]
    check_graduated: false
    class_years: [2027] # Fixed synthetic cohort used only by graduation-year unit tests.
    regex_kill: []

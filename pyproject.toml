[build-system]
requires = ["setuptools>=77,<81", "wheel>=0.45,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "job-pipeline"
version = "0.1.0"
description = "本地求职工作台：岗位采集、证据匹配与人工挑选"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
authors = [{name = "Ben Li"}]
dependencies = [
  "PyYAML>=6,<7", "jsonschema>=4,<5", "jieba>=0.42,<0.43",
  "rich>=13,<15", "Flask>=3,<4", "platformdirs>=4,<5", "filelock>=3.13,<4",
  "keyring>=25,<26", "pypdf>=5,<7", "python-docx>=1.1,<2",
  "openai>=2.54,<3", "anthropic>=0.125,<1", "waitress>=3,<4"
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "build>=1,<2", "playwright>=1.50,<2"]

[project.scripts]
job-pipeline = "jp.cli:main"

[tool.setuptools.packages.find]
include = ["jp*", "board*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
jp = ["resources/*.json", "resources/*.yaml", "resources/*.txt", "resources/*.md", "resources/*.sql", "resources/llm/specs/*/*.md", "resources/llm/schemas/*.json", "resources/examples/*"]
board = ["templates/*.html", "static/*.js", "static/*.css", "*.ico"]

[tool.pytest.ini_options]
testpaths = ["tests"]
